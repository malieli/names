<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שמות לבנות — מוצאים שם</title>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script>window.LIST_CONFIG = { gender: 'girl', title: 'שמות לבנות', emoji: '👧' };</script>
  <script src="names.js"></script>
  <script src="layout.js"></script>
  <script src="list-page.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="list-banner">
  <img src="images/pregnant.jpg" alt="" />
</div>

<div class="list-intro">
  <h1 id="pageTitle">שמות לבנות</h1>
  <p class="list-sub">100 שמות נבחרים — חפשו לפי שם או משמעות</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="חפשו שם..." oninput="renderList()" />
  </div>
  <div class="filter-chips">
    <button class="chip active" data-filter="all"           onclick="setFilter(this)">הכל</button>
    <button class="chip"        data-filter="sources"       onclick="setFilter(this)">מקורות</button>
    <button class="chip"        data-filter="international" onclick="setFilter(this)">מוכר בחו"ל</button>
    <button class="chip"        data-filter="nature"        onclick="setFilter(this)">מהטבע</button>
  </div>
</div>

<div class="list-main">
  <div class="list-count" id="listCount"></div>
  <div class="names-grid" id="namesGrid"></div>
</div>

</body>
</html>
