<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מוצאים שם</title>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <script src="names.js"></script>
  <style>
    body {
      font-family: 'Assistant', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── NAV ── */
    nav {
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .nav-logo {
      font-family: 'Secular One', sans-serif;
      font-size: 1.05rem;
      color: var(--accent);
      text-decoration: none;
    }
    .hamburger { display: flex; padding: 8px; }

    .nav-menu {
      display: none;
      position: fixed;
      top: 54px; right: 0; left: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 24px var(--shadow);
      z-index: 99;
      padding: 8px 0 16px;
    }
    .nav-menu.open { display: block; }
    .nav-menu a {
      display: block;
      padding: 12px 20px;
      color: var(--sub);
      text-decoration: none;
      font-size: .97rem;
      font-weight: 600;
      transition: background .15s;
    }
    .nav-menu a:active { background: var(--accent-soft); }
    .nav-menu .nav-cta {
      margin: 10px 16px 0;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      text-align: center;
      padding: 12px 20px;
    }
    .nav-menu .nav-desktop {
      font-size: .82rem;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    /* ── MAIN ── */
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 36px;
      gap: 12px;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 22px;
      box-shadow: 0 6px 28px var(--shadow);
      border: 1px solid var(--border);
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      min-height: 480px;
    }

    .card-img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .heart-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 1.3rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform .15s, border-color .15s;
      z-index: 2;
    }
    .heart-btn:active { transform: scale(1.2); border-color: var(--pink); }

    .card-name {
      font-family: 'Secular One', sans-serif;
      font-size: 2.8rem;
      color: var(--accent);
      text-align: center;
      line-height: 1;
    }
    .card-translit {
      font-size: .88rem;
      color: var(--sub);
      margin-top: 6px;
      direction: ltr;
      letter-spacing: .03em;
    }
    .card-short-text {
      font-size: .84rem;
      color: var(--sub);
      margin-top: 7px;
      text-align: center;
      line-height: 1.55;
    }
    .card-meaning {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 5px;
      text-align: center;
      line-height: 1.5;
    }
    .card-numerology {
      font-size: .8rem;
      color: var(--accent);
      margin-top: 5px;
      font-weight: 600;
      min-height: 1.2em;
    }
    .card-famous {
      font-size: .76rem;
      color: var(--sub);
      margin-top: 5px;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.55;
      min-height: 2.4em;
      width: 100%;
    }

    .card-nav {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .nav-btn {
      background: var(--accent-soft);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      padding: 7px 22px;
      cursor: pointer;
      transition: background .15s;
      min-width: 60px;
    }
    .nav-btn:active:not(:disabled) { background: #e0d0ff; }
    .nav-btn:disabled { opacity: .3; cursor: default; }

    /* ── GENDER BUTTONS ── */
    .gender-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 440px;
    }
    .gender-btn {
      padding: 14px 8px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      font-family: 'Assistant', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--sub);
      cursor: pointer;
      transition: all .14s;
      text-align: center;
    }
    .gender-btn:active { transform: scale(.96); }
    .gender-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 3px 12px rgba(108,63,197,.28);
    }

    /* ── CATEGORY FILTER CHIPS ── */
    .filter-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 7px;
      width: 100%;
      max-width: 440px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 9px 18px;
      border: 1.5px solid var(--border);
      border-radius: 50px;
      background: var(--surface);
      font-family: 'Assistant', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      color: var(--sub);
      cursor: pointer;
      transition: all .14s;
      white-space: nowrap;
    }
    .filter-chip:active { transform: scale(.95); }
    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(108,63,197,.22);
    }

    /* ── LIKED PANEL ── */
    .liked-panel {
      width: 100%;
      max-width: 440px;
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 14px 12px;
    }
    .liked-panel.has-items { display: block; }
    .liked-title {
      font-size: .78rem;
      font-weight: 700;
      color: var(--sub);
      letter-spacing: .03em;
      margin-bottom: 10px;
    }
    .liked-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .liked-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #fff0f7;
      border: 1px solid #f0b3d0;
      border-radius: 50px;
      padding: 5px 12px 5px 8px;
      font-family: 'Secular One', sans-serif;
      font-size: .92rem;
      color: #880060;
    }
    .liked-chip button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: .7rem;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }
    .liked-chip button:active { color: var(--pink); }

    /* ── DESKTOP LINK ── */
    .desktop-link {
      font-size: .72rem;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
      padding-bottom: 4px;
      background: none;
      border: none;
      font-family: inherit;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="mobile.html">מוצאים שם ✨</a>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="a11y-toggle" onclick="toggleA11yBar()" aria-label="נגישות" title="נגישות">Aa</button>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="תפריט">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
<div class="a11y-bar" id="a11yBar" role="toolbar" aria-label="סרגל נגישות">
  <span class="a11y-label">נגישות</span>
  <button onclick="a11y('font-up')"   title="הגדל טקסט">A+</button>
  <button onclick="a11y('font-down')" title="הקטן טקסט">A−</button>
  <button onclick="a11y('contrast')"  title="ניגודיות גבוהה" data-a11y="contrast">◑</button>
  <button onclick="a11y('grayscale')" title="גווני אפור"      data-a11y="grayscale">◐</button>
  <button onclick="a11y('underline')" title="הדגש קישורים"   data-a11y="underline"><u>A</u></button>
  <button onclick="a11y('reset')"     class="a11y-reset">איפוס</button>
  <button onclick="a11y('close')">✕</button>
</div>
<div class="nav-menu" id="navMenu">
  <a href="mobile.html"  onclick="closeMenu()">דף הבית</a>
  <a href="boys.html"    onclick="closeMenu()">שמות לבנים</a>
  <a href="girls.html"   onclick="closeMenu()">שמות לבנות</a>
  <a href="unisex.html"  onclick="closeMenu()">יוניסקס</a>
  <a href="mailto:mali.aroesti@gmail.com" class="nav-cta" onclick="closeMenu()">צור קשר</a>
  <a href="index.html" class="nav-desktop" onclick="closeMenu()">🖥 גרסת מחשב</a>
</div>

<!-- MAIN -->
<div class="main">

  <!-- GENDER BUTTONS -->
  <div class="gender-row">
    <button class="gender-btn" data-val="boy"  onclick="setGender(this)">בן</button>
    <button class="gender-btn" data-val="girl" onclick="setGender(this)">בת</button>
    <button class="gender-btn" data-val="any"  onclick="setGender(this)">הפתעה</button>
  </div>

  <!-- CATEGORY FILTERS -->
  <div class="filter-row">
    <button class="filter-chip" data-filter="unisex"        onclick="toggleFilter(this)">יוניסקס</button>
    <button class="filter-chip" data-filter="sources"       onclick="toggleFilter(this)">מקורות</button>
    <button class="filter-chip" data-filter="international" onclick="toggleFilter(this)">חו"ל</button>
    <button class="filter-chip" data-filter="ahvy"          onclick="toggleFilter(this)">אהו"י</button>
    <button class="filter-chip" data-filter="nature"        onclick="toggleFilter(this)">טבע</button>
  </div>

  <!-- CARD -->
  <div class="card" id="card">
    <img class="card-img" id="cardImg" src="" alt="" onclick="showRandom()" style="cursor:pointer" title="לחצו להגרלה מחדש" />
    <button class="heart-btn" id="heartBtn" onclick="likeAndNext()" title="שמרו את השם">♡</button>
    <div class="card-name"       id="cardName"></div>
    <div class="card-translit"   id="cardTranslit"></div>
    <div class="card-meaning"    id="cardMeaning"></div>
    <div class="card-short-text" id="cardShortText"></div>
    <div class="card-numerology" id="cardNumerology"></div>
    <div class="card-famous"     id="cardFamous"></div>
    <div class="card-nav">
      <button class="nav-btn" id="navBack" onclick="goBack()"    disabled>→</button>
      <button class="nav-btn" id="navFwd"  onclick="goForward()"         >←</button>
    </div>
  </div>

  <!-- LIKED NAMES -->
  <div class="liked-panel" id="likedPanel">
    <div class="liked-title">❤️ השמות שלי</div>
    <div class="liked-chips" id="likedChips"></div>
  </div>

  <button class="desktop-link" onclick="window.location.href='index.html'">עבור לגרסת המחשב</button>

</div>

<script>
// ── State ──
let gender = null;
const activeFilters = new Set();
const likedNames = [];
let currentName = null;
const cardHistory = [];
let historyIndex = -1;
const shownNames = new Set();
let currentPoolKey = '';

// ── Accessibility ──
var A11Y_KEY = 'a11y_prefs';
var A11Y_DEF = { fontSize: 0, contrast: false, grayscale: false, underline: false };
var a11yState = JSON.parse(localStorage.getItem(A11Y_KEY) || 'null') || Object.assign({}, A11Y_DEF);

function applyA11y() {
  var html = document.documentElement;
  html.style.fontSize = a11yState.fontSize === 0 ? '' : (100 + a11yState.fontSize * 10) + '%';
  html.classList.toggle('a11y-contrast',  a11yState.contrast);
  html.classList.toggle('a11y-grayscale', a11yState.grayscale);
  html.classList.toggle('a11y-underline', a11yState.underline);
  localStorage.setItem(A11Y_KEY, JSON.stringify(a11yState));
  var bar = document.getElementById('a11yBar');
  if (!bar) return;
  bar.querySelector('[data-a11y="contrast"]') .classList.toggle('active', a11yState.contrast);
  bar.querySelector('[data-a11y="grayscale"]').classList.toggle('active', a11yState.grayscale);
  bar.querySelector('[data-a11y="underline"]').classList.toggle('active', a11yState.underline);
}
function a11y(action) {
  switch (action) {
    case 'font-up':   a11yState.fontSize = Math.min(a11yState.fontSize + 1, 3);  break;
    case 'font-down': a11yState.fontSize = Math.max(a11yState.fontSize - 1, -1); break;
    case 'contrast':  a11yState.contrast  = !a11yState.contrast;  break;
    case 'grayscale': a11yState.grayscale = !a11yState.grayscale; break;
    case 'underline': a11yState.underline = !a11yState.underline; break;
    case 'reset':     a11yState = Object.assign({}, A11Y_DEF);    break;
    case 'close':     document.getElementById('a11yBar').classList.remove('a11y-open'); return;
  }
  applyA11y();
}
function toggleA11yBar() {
  document.getElementById('a11yBar').classList.toggle('a11y-open');
}

// ── Nav menu ──
function toggleMenu() {
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('navMenu').classList.toggle('open');
}
function closeMenu() {
  document.getElementById('hamburger').classList.remove('open');
  document.getElementById('navMenu').classList.remove('open');
}
// close menu on outside tap
document.addEventListener('click', function(e) {
  var menu = document.getElementById('navMenu');
  var burger = document.getElementById('hamburger');
  if (menu.classList.contains('open') && !menu.contains(e.target) && !burger.contains(e.target)) {
    closeMenu();
  }
});

// ── Render card ──
function displayCard(n) {
  currentName = n;
  document.getElementById('cardImg').src             = n.gender === 'boy' ? 'images/baby-boy.png' : 'images/baby-girl.png';
  document.getElementById('cardName').textContent    = n.niqqud || n.name;
  document.getElementById('cardTranslit').textContent   = n.transliteration || '';
  document.getElementById('cardShortText').textContent  = n.short_text || '';
  document.getElementById('cardMeaning').textContent    = n.meaning || '';
  document.getElementById('cardNumerology').textContent = n.numerology ? 'ערך נומרולוגי: ' + n.numerology : '';
  document.getElementById('cardFamous').textContent   = n.famous ? 'מפורסמים: ' + n.famous : '';
  document.getElementById('heartBtn').textContent    = likedNames.some(function(l){ return l.name === n.name; }) ? '❤️' : '♡';
  updateNavButtons();
}

function pushAndDisplay(n) {
  if (historyIndex < cardHistory.length - 1) cardHistory.splice(historyIndex + 1);
  cardHistory.push(n);
  historyIndex = cardHistory.length - 1;
  displayCard(n);
}

// ── Pool logic ──
function getPool() {
  var pool = gender === 'boy'  ? namesData.filter(function(n){ return n.gender === 'boy'; })
           : gender === 'girl' ? namesData.filter(function(n){ return n.gender === 'girl'; })
           : namesData.slice();
  if (activeFilters.size > 0) {
    var filtered = pool.filter(function(n) {
      if (activeFilters.has('unisex')        && !n.unisex)               return false;
      if (activeFilters.has('sources')       && !n.sources)              return false;
      if (activeFilters.has('international') && !n.international)        return false;
      if (activeFilters.has('ahvy')          && !/[אהוי]/.test(n.name)) return false;
      if (activeFilters.has('nature')        && !n.nature)               return false;
      return true;
    });
    if (filtered.length > 0) pool = filtered;
  }
  return pool;
}

function getPoolKey() {
  return (gender || 'any') + '|' + [...activeFilters].sort().join(',');
}

function showRandom() {
  var pool = getPool();
  var key  = getPoolKey();

  if (key !== currentPoolKey) {
    shownNames.clear();
    currentPoolKey = key;
  }

  var unseen = pool.filter(function(n) { return !shownNames.has(n.name); });
  if (unseen.length === 0) return; // all names shown — stay on current

  var picked = unseen[Math.floor(Math.random() * unseen.length)];
  shownNames.add(picked.name);
  pushAndDisplay(picked);
}

// ── Navigation ──
function goBack() {
  if (historyIndex > 0) { historyIndex--; displayCard(cardHistory[historyIndex]); }
}
function goForward() {
  if (historyIndex < cardHistory.length - 1) { historyIndex++; displayCard(cardHistory[historyIndex]); }
  else showRandom();
}
function updateNavButtons() {
  document.getElementById('navBack').disabled = historyIndex <= 0;
}

// ── Like ──
function likeAndNext() {
  if (!currentName) return;
  var idx = likedNames.findIndex(function(l){ return l.name === currentName.name; });
  if (idx >= 0) likedNames.splice(idx, 1);
  else          likedNames.push(currentName);
  renderLiked();
  showRandom();
}
function removeLiked(name) {
  var idx = likedNames.findIndex(function(l){ return l.name === name; });
  if (idx >= 0) likedNames.splice(idx, 1);
  if (currentName && currentName.name === name)
    document.getElementById('heartBtn').textContent = '♡';
  renderLiked();
}
function showNameInCard(name) {
  var n = likedNames.find(function(l){ return l.name === name; });
  if (n) displayCard(n);
}
function renderLiked() {
  var panel = document.getElementById('likedPanel');
  if (likedNames.length === 0) { panel.classList.remove('has-items'); return; }
  panel.classList.add('has-items');
  document.getElementById('likedChips').innerHTML = likedNames.map(function(n) {
    var safe = n.name.replace(/'/g, "\\'");
    return '<div class="liked-chip">' +
      '<span style="cursor:pointer" onclick="showNameInCard(\'' + safe + '\')">' + (n.niqqud || n.name) + '</span>' +
      '<button onclick="removeLiked(\'' + safe + '\')" title="הסר">✕</button>' +
      '</div>';
  }).join('');
}

// ── Gender ──
function setGender(btn) {
  document.querySelectorAll('.gender-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  gender = btn.dataset.val;
  showRandom();
}

// ── Filters ──
function toggleFilter(btn) {
  var f = btn.dataset.filter;
  if (activeFilters.has(f)) { activeFilters.delete(f); btn.classList.remove('active'); }
  else                      { activeFilters.add(f);    btn.classList.add('active'); }
  showRandom();
}

// ── Swipe ──
var touchStartX = 0, touchStartY = 0;
var card = document.getElementById('card');
card.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
card.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 55) {
    if (dx < 0) goForward();
    else        goBack();
  }
}, { passive: true });

// ── Init ──
applyA11y();
(function() {
  if (typeof namesData === 'undefined' || !namesData.length) return;
  var n = namesData[Math.floor(Math.random() * namesData.length)];
  gender = n.gender;
  var btn = document.querySelector('.gender-btn[data-val="' + gender + '"]');
  if (btn) btn.classList.add('active');
  pushAndDisplay(n);
})();
</script>

</body>
</html>
